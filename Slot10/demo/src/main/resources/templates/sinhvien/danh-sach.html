<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(${tieuDe})}">
    <title>Danh sách sinh viên</title>
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-4">

    <h2 class="mb-4">
        <i class="bi bi-people-fill me-2"></i>
        <span th:text="${tieuDe}">Danh sách sinh viên</span>
    </h2>

    <div class="table-responsive"
         th:unless="${#lists.isEmpty(sinhViens)}">

        <table class="table table-bordered table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>STT</th>
                <th>Mã sinh viên</th>
                <th>Họ và tên</th>
                <th>Điểm trung bình</th>
                <th>Xếp loại</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="sv, stat : ${sinhViens}">
                <td th:text="${stat.count}">1</td>
                <td th:text="${sv.maSV}">SV001</td>
                <td th:text="${sv.hoTen}">Nguyễn Văn An</td>
                <td th:text="${#numbers.formatDecimal(sv.diemTB, 1, 1)}">8.5</td>
                <td>
                    <span class="badge bg-success"
                          th:if="${sv.diemTB >= 8}">Giỏi</span>

                    <span class="badge bg-primary"
                          th:if="${sv.diemTB >= 6.5 and sv.diemTB < 8}">Khá</span>

                    <span class="badge bg-warning text-dark"
                          th:if="${sv.diemTB < 6.5}">Trung bình</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="alert alert-info"
         th:if="${#lists.isEmpty(sinhViens)}">
        Không có sinh viên nào.
    </div>

    <p class="text-muted"
       th:unless="${#lists.isEmpty(sinhViens)}">
        Tổng số sinh viên:
        <strong th:text="${#lists.size(sinhViens)}">0</strong>
    </p>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
