<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Danh sách sản phẩm</title>

    <link rel="stylesheet"
          th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet"
          th:href="@{/vendor/bootstrap-icons/bootstrap-icons.min.css}">
    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>
<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>
            <i class="bi bi-box-seam me-2"></i>
            Danh sách sản phẩm
        </h2>

        <a th:href="@{/sanpham/them}" class="btn btn-primary">
            <i class="bi bi-plus-circle me-1"></i>
            Thêm sản phẩm
        </a>
    </div>

    <!-- Thông báo sau khi thêm thành công -->
    <div class="alert alert-success alert-dismissible fade show"
         th:if="${thongBao != null}"
         role="alert">

        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${thongBao}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert"
                aria-label="Close"></button>
    </div>

    <!-- Danh sách rỗng -->
    <div class="alert alert-info"
         th:if="${#lists.isEmpty(danhSach)}">
        Chưa có sản phẩm nào.
    </div>

    <!-- Bảng sản phẩm -->
    <div class="table-responsive"
         th:unless="${#lists.isEmpty(danhSach)}">

        <table class="table table-bordered table-striped table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>STT</th>
                <th>Mã sản phẩm</th>
                <th>Tên sản phẩm</th>
                <th>Giá</th>
                <th>Số lượng</th>
                <th>Thành tiền</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="sp, stat : ${danhSach}">
                <td th:text="${stat.count}">1</td>
                <td th:text="${sp.maSP}">SP001</td>
                <td th:text="${sp.tenSP}">Bàn phím cơ</td>
                <td th:text="${#numbers.formatDecimal(sp.gia, 1, 0)}">
                    500000
                </td>
                <td th:text="${sp.soLuong}">2</td>
                <td th:text="${#numbers.formatDecimal(sp.gia * sp.soLuong, 1, 0)}">
                    1000000
                </td>
            </tr>
            </tbody>
        </table>

        <p class="text-muted">
            Tổng số sản phẩm:
            <strong th:text="${#lists.size(danhSach)}">0</strong>
        </p>
    </div>

</div>

<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
