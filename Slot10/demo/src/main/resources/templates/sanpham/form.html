<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Thêm sản phẩm')}">
    <title>Thêm sản phẩm</title>
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5">

    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">

            <div class="card shadow-sm">

                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">
                        <i class="bi bi-plus-circle me-2"></i>
                        Thêm sản phẩm
                    </h4>
                </div>

                <div class="card-body">

                    <form th:action="@{/sanpham/them}"
                          th:object="${sanPham}"
                          method="post">

                        <div class="mb-3">
                            <label for="maSP" class="form-label">Mã sản phẩm</label>
                            <input type="text"
                                   class="form-control"
                                   th:field="*{maSP}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="tenSP" class="form-label">Tên sản phẩm</label>
                            <input type="text"
                                   class="form-control"
                                   th:field="*{tenSP}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="gia" class="form-label">Giá sản phẩm</label>
                            <input type="number"
                                   class="form-control"
                                   th:field="*{gia}"
                                   min="0"
                                   step="0.01"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="soLuong" class="form-label">Số lượng</label>
                            <input type="number"
                                   class="form-control"
                                   th:field="*{soLuong}"
                                   min="0"
                                   step="1"
                                   required>
                        </div>

                        <div class="d-flex justify-content-between">

                            <a th:href="@{/sanpham/danhsach}"
                               class="btn btn-secondary">
                                <i class="bi bi-arrow-left me-1"></i>
                                Danh sách
                            </a>

                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save me-1"></i>
                                Lưu sản phẩm
                            </button>

                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
