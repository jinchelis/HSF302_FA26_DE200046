
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<!-- Bài 3: Sinh viên và Sản phẩm -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Thymeleaf Demo</title>

    <link rel="stylesheet"
          th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet"
          th:href="@{/vendor/bootstrap-icons/bootstrap-icons.min.css}">
    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<!-- Bài 4: Khóa học -->
<th:block th:fragment="commonHead(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">Thymeleaf Demo</title>

    <link rel="stylesheet"
          th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet"
          th:href="@{/vendor/bootstrap-icons/bootstrap-icons.min.css}">
    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</th:block>

<!-- Navbar -->
<nav th:fragment="navbar(active)"
     class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-leaf me-1"></i>Thymeleaf Demo
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNav"
                aria-controls="mainNav"
                aria-expanded="false"
                aria-label="Menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">

            <ul class="navbar-nav ms-auto">

                <!-- Trang chủ -->
                <li class="nav-item">
                    <a class="nav-link"
                       th:classappend="${active == 'home'} ? 'active'"
                       th:href="@{/}">
                        Trang chủ
                    </a>
                </li>

                <!-- Sinh viên -->
                <li class="nav-item">
                    <a class="nav-link"
                       th:classappend="${active == 'sinhvien'} ? 'active'"
                       th:href="@{/sinhvien}">
                        Sinh viên
                    </a>
                </li>

                <!-- Sản phẩm -->
                <li class="nav-item">
                    <a class="nav-link"
                       th:classappend="${active == 'sanpham'} ? 'active'"
                       th:href="@{/sanpham/them}">
                        Sản phẩm
                    </a>
                </li>

                <!-- Khóa học -->
                <li class="nav-item">
                    <a class="nav-link"
                       th:classappend="${active == 'khoahoc'} ? 'active'"
                       th:href="@{/khoahoc}">
                        Khóa học
                    </a>
                </li>

            </ul>

        </div>
    </div>
</nav>

<!-- Thông báo -->
<th:block th:fragment="alerts">
    <div th:if="${successMsg}"
         class="alert alert-success alert-dismissible fade show"
         role="alert">
        <i class="bi bi-check-circle me-1"></i>
        <span th:text="${successMsg}">Thành công</span>
        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert"
                aria-label="Đóng"></button>
    </div>

    <div th:if="${errorMsg}"
         class="alert alert-danger alert-dismissible fade show"
         role="alert">
        <i class="bi bi-exclamation-triangle me-1"></i>
        <span th:text="${errorMsg}">Lỗi</span>
        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert"
                aria-label="Đóng"></button>
    </div>
</th:block>

<!-- Footer -->
<footer th:fragment="footer"
        class="border-top text-center text-muted py-3 mt-5">
    <small>© 2026 Spring Boot App – Thymeleaf Demo</small>
</footer>

<!-- Bootstrap JavaScript -->
<th:block th:fragment="scripts">
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
</th:block>

</body>
</html>
